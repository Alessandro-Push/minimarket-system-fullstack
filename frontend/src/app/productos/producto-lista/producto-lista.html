<div class="container">
    <div class="container text-center" style="margin: 30px;">
        <h3>Sistema de Inventarios</h3>
    </div>
    
    <table class="table table-dark table-hover align-middle text-center">
        <thead>
          <tr class="text-center">
            <th scope="col">Id</th>
            <th scope="col">Descripción del Producto</th>
            <th scope="col">Precio</th>
            <th scope="col">Existencia</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody class="align-middle" style="margin: auto;">
          @for(producto of productos(); track producto.idProducto){
              <tr>
              
              <th scope="row">{{producto.idProducto}}</th>
              <td>{{producto.descripcion}}</td>
              <td>{{producto.precio}}</td>
              <td>{{producto.existencia}}</td>
              <td class="d-flex justify-content-center" >
                <div class="d-flex" >
                  <button (click)="editarProducto(producto.idProducto)" 
                  class="btn btn-warning btn-sm me-3">Editar</button>
                  <button (click)="eliminarProducto(producto.idProducto)" 
                  class="btn btn-danger btn-sm">Eliminar</button>
                </div>
                
              </td>
            </tr>
          }
      
        </tbody>
        
      </table>
      <div class="container text-center" style="margin: 30px;">
        <button routerLink="/agregar-producto" class="btn btn-success  btn-sm">
          Agregar
        </button>
      </div>
      
</div>
