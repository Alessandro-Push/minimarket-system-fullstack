<div class="container">
    <div class="container text-center" style="margin: 30px;">
        <h3>Sistema de Clientes</h3>
    </div>
    <table class="table table-dark table-hover align-middle text-center">
        <thead>    
          <tr>
            <th scope="col">Id</th>
            <th scope="col">Nombre</th>
            <th scope="col">Apellido</th>
            <th scope="col">Email</th>
            <th scope="col text-center">Acciones</th>
          </tr>
        
        </thead>
        <tbody>
          @for (cliente of clientes(); track cliente.idCliente) {
          <tr>
            <th scope="row">{{cliente.idCliente}}</th>
            <td>{{cliente.nombre}}</td>
            <td>{{cliente.apellido}}</td>
            <td>{{cliente.email}}</td>
            <td class="d-flex justify-content-center" >
              <div class="d-flex">
                <button (click)="editarCliente(cliente.idCliente)" 
                class="btn btn-warning btn-sm me-3">Editar</button>
                <button (click)="eliminarCliente(cliente.idCliente)"
                class="btn btn-danger btn-sm ">Eliminar</button>
              </div>
            </td>
            
          </tr>
        }
        </tbody>
      </table>
      <div class="container text-center" style="margin: 30px;">
        <button routerLink="/agregar-cliente" class="btn btn-success btn-sm">
          Agregar
        </button>
      </div>
</div>
